<html lang="en">
<head>
<meta charset="UTF-8">

<title>Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

    --bg:#0c1a10;
    --panel:#132b1a;
    --panel2:#1c4025;
    --gold:#c9a227;
    --gold-soft:#e8cf7a;
    --crimson:#c1446b;
    --ink:#e8ece6;
    --ink-dim:#9db3a1;
    --black-suit:#151826;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(ellipse at top, #1e3d26 0%, var(--bg) 60%);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    display:flex; justify-content:center;
    padding:24px 16px 60px;
  }
  .app{width:100%; max-width:520px;}
  h1.title{
    font-family:'Cinzel',serif; font-weight:700;
    font-size:2.4rem; text-align:center; letter-spacing:0.08em;
    margin:8px 0 4px; color:var(--gold-soft);
    text-shadow:0 0 24px rgba(201,162,39,0.3);
  }
  .subtitle{text-align:center; color:var(--ink-dim); font-size:0.85rem; margin-bottom:28px; letter-spacing:0.04em;}
  .panel{
    background:linear-gradient(160deg, var(--panel), var(--panel2));
    border:1px solid rgba(201,162,39,0.25);
    border-radius:14px; padding:22px;
    margin-bottom:16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
  }
  .choice-grid{display:grid; gap:14px; margin-top:8px;}
  button.big-choice{
    background:var(--panel2); border:1px solid rgba(201,162,39,0.3);
    border-radius:12px; padding:18px; color:var(--ink);
    font-family:'Inter'; font-size:1rem; font-weight:600; text-align:left;
    cursor:pointer; transition:all .15s ease;
  }
  button.big-choice:hover{border-color:var(--gold); background:#254a2e; transform:translateY(-1px);}
  button.big-choice small{display:block; color:var(--ink-dim); font-weight:400; margin-top:4px; font-size:0.8rem;}
  .choice-title{font-size:1.02rem; font-weight:700; color:var(--ink);}
  .choice-versus{font-size:0.85rem; font-weight:600; color:var(--gold-soft); margin-top:2px;}
  .footer{text-align:center; color:var(--ink-dim); font-size:0.7rem; opacity:0.55; margin-top:32px; line-height:1.6;}
  .info-p{font-size:0.87rem; line-height:1.55; color:var(--ink); margin-bottom:10px;}
  .info-warn{font-size:0.87rem; line-height:1.55; color:var(--crimson); margin-bottom:10px; border-left:2px solid var(--crimson); padding-left:12px;}
  .info-section-title{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); font-weight:600; margin:18px 0 8px;}
  .contact-label-fixed{display:inline-block; width:6.5em;}
  button.action{
    background:var(--gold); color:#1a1200; border:none; border-radius:10px;
    padding:13px 20px; font-weight:600; font-size:0.95rem; cursor:pointer;
    width:100%; margin-top:6px; transition:transform .1s ease;
    font-family:'Inter';
  }
  button.action:hover{transform:translateY(-1px); background:var(--gold-soft);}
  button.action:disabled{opacity:0.35; cursor:not-allowed; transform:none;}
  button.ghost{
    background:transparent; border:1px solid rgba(163,168,201,0.35); color:var(--ink-dim);
    border-radius:10px; padding:10px 16px; font-size:0.85rem; cursor:pointer; width:100%;
    margin-top:8px; font-family:'Inter';
  }
  button.ghost:hover{border-color:var(--ink-dim); color:var(--ink);}
  .label{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--gold); font-weight:600; margin-bottom:6px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .cardface{
    width:64px; height:92px; border-radius:8px; background:#f4f1ea;
    display:flex; flex-direction:column; justify-content:space-between; align-items:center;
    padding:6px; font-family:'Inter'; font-weight:600;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
  }
  .cardface.reveal{ animation:flipin .35s ease; }
  .cardface.joker{background:linear-gradient(160deg,#2a1a3a,#151020); color:var(--gold-soft); border:1px solid var(--gold);}
  @keyframes flipin{
    from{transform:rotateY(90deg); opacity:0;}
    to{transform:rotateY(0deg); opacity:1;}
  }
  .cardface .rank{font-size:0.95rem; align-self:flex-start;}
  .cardface .suit-big{font-size:1.6rem;}
  .card-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .score-board{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .score-block{text-align:center; flex:1;}
  .score-num{font-family:'Cinzel'; font-size:1.8rem; color:var(--gold-soft); font-weight:700;}
  .score-name{font-size:0.72rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;}
  .score-name.mp-left{text-align:left;}
  .vs{color:var(--ink-dim); font-family:'Cinzel'; padding:0 10px;}
  .log{max-height:150px; overflow-y:auto; font-size:0.82rem; color:var(--ink-dim); border-top:1px solid rgba(163,168,201,0.15); padding-top:10px; margin-top:10px;}
  .log div{padding:3px 0; border-bottom:1px dashed rgba(163,168,201,0.1);}
  .banner{
    text-align:center; padding:10px; border-radius:8px; margin-bottom:14px;
    background:rgba(201,162,39,0.12); border:1px solid rgba(201,162,39,0.3);
    font-size:0.88rem; color:var(--gold-soft);
  }
  .result-title{font-family:'Cinzel'; font-size:1.5rem; text-align:center; color:var(--gold-soft); margin-bottom:6px;}
  .result-sub{text-align:center; color:var(--ink-dim); font-size:0.85rem; margin-bottom:18px;}
  .hidden{display:none !important;}
  .point-row{display:flex; justify-content:center; gap:6px; margin:8px 0;}
  .point-star{width:30px; height:36px; border-radius:5px; background:var(--panel2); border:1px solid rgba(201,162,39,0.3); display:flex; align-items:center; justify-content:center; font-size:1.1rem;}
  .point-star.claimed{background:var(--gold); color:#1a1200;}
  .pool-tracker{text-align:center; color:var(--gold-soft); font-size:0.85rem; margin-bottom:10px; letter-spacing:0.03em;}
  .pass-screen{text-align:center; padding:50px 20px;}
  .pass-screen .icon{font-size:3rem; margin-bottom:14px;}
</style>
</head>
<body>
<div class="app">
  <h1 class="title">SPLIT</h1>
  <div class="subtitle">Guard &nbsp;·&nbsp; Assassin</div>
  <div id="root"></div>
  <div class="footer">SPLIT © 2026 Salis Padli<br>All rights reserved</div>
</div>

<script>
const SUITS = {S:{sym:'♠',color:'black'}, C:{sym:'♣',color:'black'}, H:{sym:'♥',color:'red'}, D:{sym:'♦',color:'red'}};
const SUIT_KEYS = ['S','C','H','D'];
const RANK_LABEL = r => r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);

function freshDeck(includeJoker){
  const d = [];
  for(const s of SUIT_KEYS) for(let r=1;r<=13;r++) d.push({suit:s, rank:r});
  if(includeJoker) d.push({suit:'JOKER', rank:null});
  for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
  return d;
}
function safePoints(card){
  if(card.suit==='S') return 0;
  return card.rank===1 ? 2 : 1;
}
function cardHTML(card, reveal){
  const revClass = reveal ? ' reveal' : '';
  if(card.suit==='JOKER') return `<div class="cardface joker${revClass}"><div class="rank">✦</div><div class="suit-big">🃏</div><div class="rank">FATE</div></div>`;
  const info = SUITS[card.suit];
  const col = info.color==='red' ? '#b8395f' : '#151826';
  return `<div class="cardface${revClass}" style="color:${col}"><div class="rank">${RANK_LABEL(card.rank)}</div><div class="suit-big">${info.sym}</div><div class="rank" style="align-self:flex-end">${RANK_LABEL(card.rank)}</div></div>`;
}
function pairingExists(cards){
  const suits = cards.map(c=>c.suit), ranks = cards.map(c=>c.rank);
  return new Set(suits).size < suits.length || new Set(ranks).size < ranks.length;
}
function matchCount(cards, W){ return cards.filter(c=>c.suit===W).length; }
function isFace(card){ return card.rank===11 || card.rank===12 || card.rank===13; }

const root = document.getElementById('root');
function render(html){ root.innerHTML = html; }

// ---------------- MODE SELECT ----------------
function showModeSelect(){
  render(`
    <div class="panel">
      <div class="choice-grid">
        <button class="big-choice" onclick="startSolo()">
          <div class="choice-title">🛡️ Single Player</div>
          <div class="choice-versus">Guard vs Assassin</div>
          <small>Draw alone. Watch which role wins as the deck runs down. Any Ace drawn makes that round the last one.</small>
        </button>
        <button class="big-choice" onclick="showRoleSelect()">
          <div class="choice-title">⚔️ Multiplayer</div>
          <div class="choice-versus">Sharer vs Claimer</div>
          <small>Two players, one deck, two points. Choose your intent in secret.</small>
        </button>
      </div>
    </div>
    <div class="row">
      <button class="ghost" onclick="showAbout()">ℹ️ About</button>
      <button class="ghost" onclick="showContact()">✉️ Contact</button>
    </div>
  `);
}

// ---------------- ABOUT ----------------
function showAbout(){
  render(`
    <div class="panel">
      <div class="result-title" style="margin-bottom:14px;">About Split</div>

      <div class="info-section-title">What this game is</div>
      <div class="info-p">Split is a card game built around a simple tension: play it safe and take a reliable, modest result, or chase more and accept real risk — including the risk of walking away with nothing. It's playable solo, as a small probability experiment between two roles (Guard and Assassin), or with a second player, where a secret choice of intent (Sharer or Claimer) turns the same draws into a two-person social dilemma.</div>
      <div class="info-p">The whole system is built from a single standard 52-card deck — no jokers, no special equipment. Every mechanic, from the basic draws to the leverage-and-cost "Predict" decision, is designed to be playable with real physical cards, not just on a screen.</div>

      <div class="info-section-title">A note on gambling</div>
      <div class="info-warn">Split is a game of chance and strategy made for personal enjoyment, casual play, and the study of probability and decision-making. It is <b>not designed, licensed, or intended for gambling, wagering real money or anything of monetary value, or any activity regulated as gambling in any jurisdiction.</b> No feature of this game should be adapted to facilitate betting, staking, or payouts of real-world value.</div>
      <div class="info-warn">This game and its rules, mechanics, and presentation are the copyrighted work of its creator. The creator reserves the right to take action against any use of this game, its name, or its mechanics in connection with gambling, betting platforms, or similar activities.</div>

      <div class="info-p" style="color:var(--ink-dim); margin-top:16px;">For more information, or to discuss collaboration, see Contact.</div>

      <button class="action" onclick="showModeSelect()" style="margin-top:8px;">← Back to menu</button>
    </div>
  `);
}

// ---------------- CONTACT ----------------
function showContact(){
  render(`
    <div class="panel">
      <div class="result-title" style="margin-bottom:14px;">Contact</div>
      <div class="info-p">Questions, feedback, or interested in collaborating on Split? Reach out through the channels below.</div>

      <div class="info-section-title">Get in touch</div>
      <div class="info-p"><span class="contact-label-fixed">Instagram</span>: @salispadli</div>
      <div class="info-p"><span class="contact-label-fixed">WhatsApp</span>: +62 898-1618-141</div>
      <div class="info-p"><span class="contact-label-fixed">Email</span>: salispadli@gmail.com</div>

      <div class="info-section-title">Support the project</div>
      <div class="info-p"><a href="http://lynk.id/salispadli/s/z2x0omwpl4r5/" target="_blank" rel="noopener" style="color:var(--ink); text-decoration:underline;">http://lynk.id/salispadli/s/z2x0omwpl4r5/</a></div>

      <button class="action" onclick="showModeSelect()" style="margin-top:8px;">← Back to menu</button>
    </div>
  `);

// ================= SOLO MODE =================
let solo;
function startSolo(autoStart){
  solo = { deck: freshDeck(false), idx:0, safe:0, amb:0, log:[], over:false };
  soloNewRound(autoStart);
}
function soloNewRound(autoStart){
  solo.round = { phase:'safe', safeCard:null, ambCards:[], bonusCard:null, lastFlag:false, W:null, k:null, pairing:null, ambWins:null, justDrew:null, predictChosen:null };
  if(autoStart){ soloDrawSafe(); } else { renderSolo(); }
}
function soloDrawRaw(){
  if(solo.idx >= solo.deck.length) return null;
  const c = solo.deck[solo.idx++];
  if(c.rank === 1){ solo.round.lastFlag = true; }
  return c;
}
function soloFinishNoCards(){
  solo.over = true;
  renderSoloFinal();
}
function soloDrawSafe(){
  const c = soloDrawRaw();
  if(!c){ soloFinishNoCards(); return; }
  solo.round.safeCard = c;
  solo.round.W = c.suit;
  solo.round.phase = 'amb';
  solo.round.justDrew = 'safe';
  renderSolo();
}
function soloDrawAmb(){
  const c = soloDrawRaw();
  if(!c){ soloFinishNoCards(); return; }
  solo.round.ambCards.push(c);
  solo.round.justDrew = 'amb';
  if(solo.round.ambCards.length === 3){
    const W = solo.round.W;
    const k = matchCount(solo.round.ambCards, W);
    const pairing = pairingExists(solo.round.ambCards);
    solo.round.k = k; solo.round.pairing = pairing;
    if(k >= 2){ solo.round.phase='resolved'; solo.round.ambWins = k; }
    else if(k === 0){ solo.round.phase = pairing ? 'bonus' : 'resolved'; if(!pairing) solo.round.ambWins = 0; }
    else { solo.round.phase = pairing ? 'predict-choice' : 'resolved'; if(!pairing) solo.round.ambWins = 1; }
  }
  renderSolo();
}
function soloDrawBonus(){
  const c = soloDrawRaw();
  if(!c){ soloFinishNoCards(); return; }
  solo.round.bonusCard = c;
  solo.round.justDrew = 'bonus';
  const W = solo.round.W;
  solo.round.ambWins = solo.round.k === 0 ? (c.suit===W ? 1 : 0) : (c.suit===W ? 2 : 1);
  solo.round.phase = 'resolved';
  renderSolo();
}
function soloChoosePredict(takePredict){
  solo.round.predictChosen = takePredict;
  const c = soloDrawRaw();
  if(!c){ soloFinishNoCards(); return; }
  solo.round.bonusCard = c;
  solo.round.justDrew = 'bonus';
  const W = solo.round.W;
  if(takePredict){
    solo.round.ambWins = 1 + (isFace(c) ? 2 : -1);
  } else {
    solo.round.ambWins = 1 + (c.suit===W ? 1 : 0);
  }
  solo.round.phase = 'resolved';
  renderSolo();
}
function soloCommitRound(){
  const r = solo.round;
  const roundSafe = safePoints(r.safeCard);
  solo.safe += roundSafe;
  solo.amb += r.ambWins;
  solo.log.unshift({ safeCard:r.safeCard, ambCards:r.ambCards, bonusCard:r.bonusCard, W:r.W, roundSafe, roundAmb:r.ambWins, lastFlag:r.lastFlag });
  const cardsLeft = solo.deck.length - solo.idx;
  if(r.lastFlag || cardsLeft < 4){ solo.over = true; renderSoloFinal(); }
  else { soloNewRound(true); }
}
function soloScoreboard(){
  return `
    <div class="score-board">
      <div class="score-block"><div class="score-num">${solo.safe}</div><div class="score-name">Guard</div></div>
      <div class="vs">vs</div>
      <div class="score-block"><div class="score-num">${solo.amb}</div><div class="score-name">Assassin</div></div>
    </div>`;
}
function soloLogHTML(){
  const rows = solo.log.map(r=>`<div>Guard ${SUITS[r.safeCard.suit].sym}${RANK_LABEL(r.safeCard.rank)} → +${r.roundSafe} &nbsp;|&nbsp; Assassin (${SUITS[r.W].sym}) → +${r.roundAmb}${r.lastFlag?' — 🂡 Ace drawn, final round':''}</div>`).join('');
  return `<div class="log">${rows || '<div style="opacity:0.6">No rounds completed yet.</div>'}</div>`;
}
function renderSolo(){
  const r = solo.round;
  const safeReveal = r.justDrew === 'safe';
  const ambRevealLast = r.justDrew === 'amb';
  const bonusReveal = r.justDrew === 'bonus';
  const ambCardsHTML = r.ambCards.map((c,i)=>cardHTML(c, ambRevealLast && i===r.ambCards.length-1)).join('');
  const aceBanner = r.lastFlag ? `<div class="banner">🂡 An Ace has been drawn — this will be the final round.</div>` : '';

  let body = '';
  if(r.phase === 'safe'){
    body = `<button class="action" onclick="soloDrawSafe()">Start</button>`;
  } else if(r.phase === 'amb'){
    const matches = matchCount(r.ambCards, r.W);
    body = `
      ${aceBanner}
      <div class="label">Guard card</div>
      <div class="card-row">${cardHTML(r.safeCard, safeReveal)}</div>
      <div class="label" style="margin-top:10px;">Assassin card (${r.ambCards.length}/3)</div>
      <div class="card-row">${ambCardsHTML}</div>
      <div style="color:var(--ink-dim); margin-bottom:2px;">Winning suit: ${SUITS[r.W].sym}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${matches} match${matches!==1?'es':''} so far.</div>
      <button class="action" onclick="soloDrawAmb()">Draw card ${r.ambCards.length+1}</button>
    `;
  } else if(r.phase === 'bonus'){
    const label = 'No wins yet, but a pairing exists — bonus draw.';
    body = `
      ${aceBanner}
      <div class="label">Guard card</div>
      <div class="card-row">${cardHTML(r.safeCard, false)}</div>
      <div class="label" style="margin-top:10px;">Assassin card (3/3)</div>
      <div class="card-row">${ambCardsHTML}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${label}</div>
      <button class="action" onclick="soloDrawBonus()">Draw bonus card</button>
    `;
  } else if(r.phase === 'predict-choice'){
    body = `
      ${aceBanner}
      <div class="label">Guard card</div>
      <div class="card-row">${cardHTML(r.safeCard, false)}</div>
      <div class="label" style="margin-top:10px;">Assassin card (3/3)</div>
      <div class="card-row">${ambCardsHTML}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">Bonus draw! Spend 1 point and choose Predict if you think the next card is a face card (J/Q/K) and win a chance to get +3 more points. Choose Continue to draw normal bonus card (match suit ${SUITS[r.W].sym}: +1, otherwise: +0).</div>
      <div class="row">
        <button class="action" onclick="soloChoosePredict(true)">Predict</button>
        <button class="ghost" onclick="soloChoosePredict(false)">Continue</button>
      </div>
    `;
  } else if(r.phase === 'resolved'){
    let resultNote = '';
    if(r.bonusCard && r.predictChosen !== null){
      if(r.predictChosen){
        resultNote = isFace(r.bonusCard) ? ' — Predict paid off! (+2)' : ' — Predict missed. (−1)';
      } else {
        resultNote = r.bonusCard.suit===r.W ? ' — bonus card matched. (+1)' : ' — bonus card missed. (+0)';
      }
    }
    body = `
      ${aceBanner}
      <div class="label">Guard card</div>
      <div class="card-row">${cardHTML(r.safeCard, false)}</div>
      <div class="label" style="margin-top:10px;">Assassin card${r.bonusCard?'s':''} (3/3${r.bonusCard?' + bonus':''})</div>
      <div class="card-row">${ambCardsHTML}${r.bonusCard?cardHTML(r.bonusCard, bonusReveal):''}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">Round result: Guard +${safePoints(r.safeCard)}, Assassin +${r.ambWins}${resultNote}</div>
      <button class="action" onclick="soloCommitRound()">Continue</button>
    `;
  }
  render(`
    <div class="panel">
      ${soloScoreboard()}
      ${body}
      ${soloLogHTML()}
    </div>
    <button class="ghost" onclick="showModeSelect()">← Back to menu</button>
  `);
}
function renderSoloFinal(){
  const winner = solo.safe > solo.amb ? 'Guard wins' : solo.amb > solo.safe ? 'Assassin wins' : "It's a tie";
  render(`
    <div class="panel">
      ${soloScoreboard()}
      <div class="result-title">${winner}</div>
      <button class="action" onclick="startSolo(true)">Play again</button>
      ${soloLogHTML()}
    </div>
    <button class="ghost" onclick="showModeSelect()">← Back to menu</button>
  `);
}

// ================= MULTIPLAYER MODE =================
function showRoleSelect(){
  mp = { p1choice:null, p2choice:null };
  renderP1Choice();
}
function renderP1Choice(){
  render(`
    <div class="panel">
      <div class="label">Player 1 — choose in secret</div>
      <div class="choice-grid">
        <button class="big-choice" onclick="setChoice('p1','sharer')">🤝 Sharer <small>Wants at least one point, comfortable giving points away.</small></button>
        <button class="big-choice" onclick="setChoice('p1','claimer')">⚔️ Claimer <small>Wants both points and will steal to get them.</small></button>
      </div>
    </div>
    <button class="ghost" onclick="showModeSelect()">← Back to menu</button>
  `);
}
function setChoice(who, val){
  if(who==='p1'){ mp.p1choice = val; renderPassScreen(); }
  else { mp.p2choice = val; resolveRoles(); }
}
function renderPassScreen(){
  render(`
    <div class="panel pass-screen">
      <div class="icon">🔒</div>
      <div style="margin-bottom:18px; color:var(--ink-dim)">Player 1's choice is locked in.<br>Pass the device to Player 2.</div>
      <button class="action" onclick="renderP2Choice()">I'm Player 2 — reveal my choices</button>
    </div>
  `);
}
function renderP2Choice(){
  render(`
    <div class="panel">
      <div class="label">Player 2 — choose in secret</div>
      <div class="choice-grid">
        <button class="big-choice" onclick="setChoice('p2','sharer')">🤝 Sharer <small>Wants at least one point, comfortable giving points away.</small></button>
        <button class="big-choice" onclick="setChoice('p2','claimer')">⚔️ Claimer <small>Wants both points and will steal to get them.</small></button>
      </div>
    </div>
  `);
}
function resolveRoles(){
  mp.scenario = (mp.p1choice==='sharer' && mp.p2choice==='sharer') ? 'SS' :
                (mp.p1choice==='claimer' && mp.p2choice==='claimer') ? 'CC' : 'SC';
  mp.deck = freshDeck(false);
  mp.idx = 0;
  mp.pool = 2;
  mp.p1Total = 0;
  mp.p2Total = 0;
  mp.firstRawCum = 0;
  mp.secondRawCum = 0;
  mp.destroyedCum = 0;
  if(mp.scenario !== 'SC'){
    mp.firstIsP1 = Math.random() < 0.5;
  }
  renderRevealOrder();
}
function mpFirstPlayerNum(){
  if(mp.scenario==='SC') return mp.p1choice==='sharer' ? 1 : 2;
  return mp.firstIsP1 ? 1 : 2;
}
function mpSecondPlayerNum(){
  return mpFirstPlayerNum()===1 ? 2 : 1;
}
function renderRevealOrder(){
  const scLabel = {SS:'Sharer – Sharer', SC:'Sharer – Claimer', CC:'Claimer – Claimer'}[mp.scenario];
  let orderText;
  if(mp.scenario==='SC'){
    orderText = `Player ${mpFirstPlayerNum()} is the Guard (Sharer).<br>Player ${mpSecondPlayerNum()} is the Assassin (Claimer).`;
  } else if(mp.scenario==='SS'){
    orderText = `Player ${mpFirstPlayerNum()} moves first — loses on Spades.<br>Player ${mpSecondPlayerNum()} moves second — loses on Hearts, and can steal.`;
  } else {
    orderText = `Player ${mpFirstPlayerNum()} moves first — hunts Spades.<br>Player ${mpSecondPlayerNum()} moves second — hunts Hearts, and can steal.`;
  }
  render(`
    <div class="panel">
      <div class="banner">${scLabel}</div>
      <div style="text-align:center; margin:14px 0; color:var(--ink-dim)">
        ${orderText}<br><br>
        2 points are up for grabs. Rounds continue until both are claimed or lost for good.
      </div>
      <button class="action" onclick="mpStartRound()">Begin</button>
    </div>
  `);
}
function drawCard(){ return mp.deck[mp.idx++]; }
function cardsLeft(){ return mp.deck.length - mp.idx; }

function mpStartRound(){
  mp.round = {};
  if(mp.scenario==='SS') mpSSFirstDraw();
  else if(mp.scenario==='SC') mpSCGuardDraw();
  else mpCCFirstAssassin();
}

// ---------------- SS: two simple 1-card draws ----------------
function mpSSFirstDraw(){
  if(cardsLeft() < 1){ mpDeckExhausted(); return; }
  const card = drawCard();
  const raw = card.suit==='S' ? 0 : (card.rank===1 ? 2 : 1);
  mp.round.firstRaw = raw;
  render(`
    <div class="panel">
      <div class="label">First draw — Player ${mpFirstPlayerNum()} (loses on Spades)</div>
      <div class="card-row">${cardHTML(card, true)}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${raw} point${raw!==1?'s':''} this round.</div>
      <button class="action" onclick="mpSSPromptSecond()">Continue — pass to Player ${mpSecondPlayerNum()}</button>
    </div>
  `);
}
function mpSSPromptSecond(){
  render(`
    <div class="panel">
      <div class="label">Player ${mpSecondPlayerNum()}'s turn</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">Ready to draw (loses on Hearts).</div>
      <button class="action" onclick="mpSSSecondDraw()">Draw card</button>
    </div>
  `);
}
function mpSSSecondDraw(){
  if(cardsLeft() < 1){ mpDeckExhausted(); return; }
  const card = drawCard();
  const raw = card.suit==='H' ? 0 : (card.rank===1 ? 2 : 1);
  mp.round.secondRaw = raw;
  render(`
    <div class="panel">
      <div class="label">Second draw — Player ${mpSecondPlayerNum()} (loses on Hearts)</div>
      <div class="card-row">${cardHTML(card, true)}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${raw} point${raw!==1?'s':''} this round.</div>
      <button class="action" onclick="mpApplyRoundResult(mp.round.firstRaw, mp.round.secondRaw, 0)">See round result</button>
    </div>
  `);
}

// ---------------- SC: Guard draw, then Assassin sequence ----------------
function mpSCGuardDraw(){
  if(cardsLeft() < 1){ mpDeckExhausted(); return; }
  const card = drawCard();
  const raw = card.suit==='S' ? 0 : (card.rank===1 ? 2 : 1);
  mp.round.guardRaw = raw;
  mp.round.targetSuit = card.suit;
  render(`
    <div class="panel">
      <div class="label">Guard draw — Player ${mpFirstPlayerNum()}</div>
      <div class="card-row">${cardHTML(card, true)}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${raw} point${raw!==1?'s':''}. Target suit for Assassin: ${SUITS[card.suit].sym}</div>
      <button class="action" onclick="mpSCStartAssassin()">Continue — Assassin draws</button>
    </div>
  `);
}
function mpSCStartAssassin(){
  mpStartAssassinSeq(mp.round.targetSuit, function(raw, destroyed){
    mpApplyRoundResult(mp.round.guardRaw, raw, destroyed ? 1 : 0);
  }, `Assassin draw — Player ${mpSecondPlayerNum()}`);
}

// ---------------- CC: two Assassin sequences (Spades, then Hearts) ----------------
function mpCCFirstAssassin(){
  mpStartAssassinSeq('S', function(raw, destroyed){
    mp.round.firstRaw = Math.min(raw, 2);
    mp.round.firstDestroyed = destroyed;
    mpCCSecondAssassin();
  }, `Assassin draw — Player ${mpFirstPlayerNum()} (hunting ♠)`);
}
function mpCCSecondAssassin(){
  mpStartAssassinSeq('H', function(raw, destroyed){
    const secondRaw = Math.min(raw, 2);
    const destroyedCount = (mp.round.firstDestroyed?1:0) + (destroyed?1:0);
    mpApplyRoundResult(mp.round.firstRaw, secondRaw, destroyedCount);
  }, `Assassin draw — Player ${mpSecondPlayerNum()} (hunting ♥)`);
}

// ---------------- Shared Assassin draw sequence (3 cards + mandatory/Predict) ----------------
function mpStartAssassinSeq(targetSuit, onComplete, roleLabel){
  mp.aseq = { targetSuit, cards:[], bonusCard:null, k:null, pairing:null, justDrew:false, onComplete, roleLabel, pendingRaw:null, pendingDestroyed:null };
  mpRenderAssassinSeq();
}
function mpDrawAssassinCard(){
  if(cardsLeft() < 1){ mpDeckExhausted(); return; }
  mp.aseq.cards.push(drawCard());
  mp.aseq.justDrew = true;
  if(mp.aseq.cards.length === 3){
    mp.aseq.k = matchCount(mp.aseq.cards, mp.aseq.targetSuit);
    mp.aseq.pairing = pairingExists(mp.aseq.cards);
  }
  mpRenderAssassinSeq();
}
function mpRenderAssassinSeq(){
  const a = mp.aseq;
  const cardsHTML = a.cards.map((c,i)=>cardHTML(c, a.justDrew && i===a.cards.length-1)).join('');
  if(a.cards.length < 3){
    const matches = matchCount(a.cards, a.targetSuit);
    render(`
      <div class="panel">
        <div class="label">${a.roleLabel} — card ${a.cards.length}/3</div>
        <div class="card-row">${cardsHTML}</div>
        <div style="color:var(--ink-dim); margin-bottom:10px;">${matches} match${matches!==1?'es':''} so far (target suit ${SUITS[a.targetSuit].sym}).</div>
        <button class="action" onclick="mpDrawAssassinCard()">Draw card ${a.cards.length+1}</button>
      </div>
    `);
    return;
  }
  const { k, pairing } = a;
  if(k >= 2){
    a.pendingRaw = k; a.pendingDestroyed = false;
    mpShowAssassinInstantResult(cardsHTML, `${k} matches — ${k} point${k!==1?'s':''} from the initial draw!`);
    return;
  }
  if(k === 0){
    if(pairing){
      render(`
        <div class="panel">
          <div class="label">${a.roleLabel}</div>
          <div class="card-row">${cardsHTML}</div>
          <div style="color:var(--ink-dim); margin-bottom:10px;">0 wins, but a pairing exists — a mandatory bonus draw is required.</div>
          <button class="action" onclick="mpAssassinMandatoryBonus()">Draw bonus card</button>
        </div>
      `);
    } else {
      a.pendingRaw = 0; a.pendingDestroyed = false;
      mpShowAssassinInstantResult(cardsHTML, `0 matches, no pairing — 0 points this turn.`);
    }
    return;
  }
  // k === 1
  if(!pairing){
    a.pendingRaw = 1; a.pendingDestroyed = false;
    mpShowAssassinInstantResult(cardsHTML, `1 match, no pairing — locked in at 1 point.`);
  } else {
    render(`
      <div class="panel">
        <div class="label">${a.roleLabel}</div>
        <div class="card-row">${cardsHTML}</div>
        <div style="color:var(--ink-dim); margin-bottom:10px;">Bonus draw! Spend 1 point and choose Predict if you think the next card is a face card (J/Q/K) and win a chance to get +3 more points. Choose Continue to draw normal bonus card (match suit ${SUITS[a.targetSuit].sym}: +1, otherwise: +0).</div>
        <div class="row">
          <button class="action" onclick="mpAssassinPredict(true)">Predict</button>
          <button class="ghost" onclick="mpAssassinPredict(false)">Continue</button>
        </div>
      </div>
    `);
  }
}
function mpAssassinMandatoryBonus(){
  if(cardsLeft() < 1){ mpDeckExhausted(); return; }
  const bonus = drawCard();
  mp.aseq.bonusCard = bonus;
  const raw = bonus.suit===mp.aseq.targetSuit ? 1 : 0;
  mp.aseq.pendingRaw = raw; mp.aseq.pendingDestroyed = false;
  mpShowAssassinBonusResult(bonus, raw===1 ? 'Bonus card matched — +1.' : 'Bonus card missed — +0.');
}
function mpAssassinPredict(takePredict){
  if(cardsLeft() < 1){ mpDeckExhausted(); return; }
  const bonus = drawCard();
  mp.aseq.bonusCard = bonus;
  let raw, destroyed, msg;
  if(takePredict){
    if(isFace(bonus)){ raw=3; destroyed=false; msg='Predict paid off — +2!'; }
    else { raw=0; destroyed=true; msg='Predict missed — that point is lost for good.'; }
  } else {
    raw = bonus.suit===mp.aseq.targetSuit ? 2 : 1;
    destroyed = false;
    msg = bonus.suit===mp.aseq.targetSuit ? 'Bonus card matched — +1 more.' : 'Bonus card missed — +0.';
  }
  mp.aseq.pendingRaw = raw; mp.aseq.pendingDestroyed = destroyed;
  mpShowAssassinBonusResult(bonus, msg);
}
function mpShowAssassinInstantResult(cardsHTML, msg){
  const a = mp.aseq;
  render(`
    <div class="panel">
      <div class="label">${a.roleLabel} result</div>
      <div class="card-row">${cardsHTML}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${msg}</div>
      <button class="action" onclick="mpAssassinSeqContinue()">Continue</button>
    </div>
  `);
}
function mpShowAssassinBonusResult(bonus, msg){
  const a = mp.aseq;
  const cardsHTML = a.cards.map(c=>cardHTML(c,false)).join('');
  render(`
    <div class="panel">
      <div class="label">${a.roleLabel} result</div>
      <div class="card-row">${cardsHTML}${cardHTML(bonus,true)}</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">${msg}</div>
      <button class="action" onclick="mpAssassinSeqContinue()">Continue</button>
    </div>
  `);
}
function mpAssassinSeqContinue(){
  const a = mp.aseq;
  a.onComplete(a.pendingRaw, a.pendingDestroyed);
}

// ---------------- Round resolution (shared pool math) ----------------
function mpShowOverflowSummary(){
  render(`
    <div class="panel">
      <div class="label">Overflow!</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">This round's combined points would have exceeded what's left in the pool. Per the overflow rule, both players settle for exactly 1 point each.</div>
      ${mpFinalScoreBlock()}
      <div class="pool-tracker">All points are accounted for.</div>
      <button class="action" onclick="showRoleSelect()">Play again</button>
    </div>
    <button class="ghost" onclick="showModeSelect()">← Back to menu</button>
  `);
}
function mpApplyRoundResult(firstRaw, secondRaw, destroyedCount){
  if(mp.scenario === 'SS'){
    if((firstRaw + secondRaw) > mp.pool){
      mp.p1Total = 1;
      mp.p2Total = 1;
      mp.pool = 0;
      mpShowOverflowSummary();
      return;
    }
    const poolAfterDestruction = Math.max(0, mp.pool - destroyedCount);
    const firstClaimUncontested = Math.min(firstRaw, poolAfterDestruction);
    const unclaimedForSecond = poolAfterDestruction - firstClaimUncontested;
    let firstClaim, secondClaim;
    if(secondRaw > unclaimedForSecond){
      secondClaim = Math.min(secondRaw, poolAfterDestruction);
      firstClaim = Math.max(0, poolAfterDestruction - secondClaim);
    } else {
      secondClaim = secondRaw;
      firstClaim = firstClaimUncontested;
    }
    if(destroyedCount===0 && firstClaim===0 && secondClaim===0){
      mpShowRedrawScreen();
      return;
    }
    const firstNum = mpFirstPlayerNum();
    if(firstNum===1){ mp.p1Total += firstClaim; mp.p2Total += secondClaim; }
    else { mp.p2Total += firstClaim; mp.p1Total += secondClaim; }
    mp.pool = poolAfterDestruction - (firstClaim + secondClaim);
    mpShowRoundSummary(firstClaim, secondClaim, destroyedCount);
    return;
  }

  // SC / CC: no seal -- track cumulative raw scores, only finalize once the 2-point budget is fully accounted for
  if(firstRaw===0 && secondRaw===0 && destroyedCount===0){
    mpShowRedrawScreen();
    return;
  }

  mp.firstRawCum += firstRaw;
  mp.secondRawCum += secondRaw;
  mp.destroyedCum += destroyedCount;

  const totalAccounted = mp.firstRawCum + mp.secondRawCum + mp.destroyedCum;
  if(totalAccounted < 2){
    mpShowInterimRoundSummary(destroyedCount);
    return;
  }

  const poolForResolution = Math.max(0, 2 - mp.destroyedCum);
  const firstClaimUncontested = Math.min(mp.firstRawCum, poolForResolution);
  const unclaimedForSecond = poolForResolution - firstClaimUncontested;
  let firstClaim, secondClaim;
  if(mp.secondRawCum > unclaimedForSecond){
    secondClaim = Math.min(mp.secondRawCum, poolForResolution);
    firstClaim = Math.max(0, poolForResolution - secondClaim);
  } else {
    secondClaim = mp.secondRawCum;
    firstClaim = firstClaimUncontested;
  }

  const firstNum = mpFirstPlayerNum();
  if(firstNum===1){ mp.p1Total = firstClaim; mp.p2Total = secondClaim; }
  else { mp.p2Total = firstClaim; mp.p1Total = secondClaim; }
  mp.pool = 0;
  mpShowRoundSummary(firstClaim, secondClaim, destroyedCount);
}
function mpShowInterimRoundSummary(destroyedCount){
  const firstNum = mpFirstPlayerNum(), secondNum = mpSecondPlayerNum();
  const destroyNote = destroyedCount>0 ? `<div style="color:var(--crimson); margin-bottom:8px;">${destroyedCount} point${destroyedCount!==1?'s':''} destroyed by a failed Predict — gone for good.</div>` : '';
  const remaining = 2 - (mp.firstRawCum + mp.secondRawCum + mp.destroyedCum);
  render(`
    <div class="panel">
      <div class="label">Round result — not yet decisive</div>
      ${destroyNote}
      <div style="color:var(--ink-dim); margin-bottom:10px;">Player ${firstNum} has ${mp.firstRawCum} raw point${mp.firstRawCum!==1?'s':''} so far; Player ${secondNum} has ${mp.secondRawCum}. Nothing is locked in yet — later rounds can still take it away.</div>
      <div class="pool-tracker">${remaining} point${remaining!==1?'s':''} still up for grabs</div>
      <button class="action" onclick="mpStartRound()">Next round</button>
    </div>
  `);
}
function mpShowRedrawScreen(){
  const remaining = mp.scenario === 'SS' ? mp.pool : (2 - (mp.firstRawCum + mp.secondRawCum + mp.destroyedCum));
  render(`
    <div class="panel">
      <div class="label">Nothing happened this round</div>
      <div style="color:var(--ink-dim); margin-bottom:10px;">No points were claimed or lost.</div>
      <div class="pool-tracker">${remaining} point${remaining!==1?'s':''} still up for grabs</div>
      <button class="action" onclick="mpStartRound()">Redraw</button>
    </div>
  `);
}
function mpPointStars(n){
  return `<div class="point-row">${[0,1].map(i=>`<div class="point-star ${i<n?'claimed':''}">${i<n?'⭐':''}</div>`).join('')}</div>`;
}
function mpChoiceOf(playerNum){ return playerNum===1 ? mp.p1choice : mp.p2choice; }
function mpFinalScoreBlock(){
  const leftNum = mpFirstPlayerNum(), rightNum = mpSecondPlayerNum();
  const leftTotal = leftNum===1 ? mp.p1Total : mp.p2Total;
  const rightTotal = rightNum===1 ? mp.p1Total : mp.p2Total;
  return `
    <div class="row">
      <div class="score-block">
        <div class="score-name mp-left">Player ${leftNum} (${mpChoiceOf(leftNum)})</div>
        <div class="score-num">${leftTotal}</div>
        ${mpPointStars(leftTotal)}
      </div>
      <div class="score-block">
        <div class="score-name mp-left">Player ${rightNum} (${mpChoiceOf(rightNum)})</div>
        <div class="score-num">${rightTotal}</div>
        ${mpPointStars(rightTotal)}
      </div>
    </div>
  `;
}
function mpShowRoundSummary(firstClaim, secondClaim, destroyedCount){
  const firstNum = mpFirstPlayerNum(), secondNum = mpSecondPlayerNum();
  const destroyNote = destroyedCount>0 ? `<div style="color:var(--crimson); margin-bottom:8px;">${destroyedCount} point${destroyedCount!==1?'s':''} destroyed by a failed Predict — gone for good.</div>` : '';
  const claimNote = `Player ${firstNum} claims ${firstClaim} this round, Player ${secondNum} claims ${secondClaim}.`;
  const gameOver = mp.pool <= 0;
  const poolLine = gameOver ? `<div class="pool-tracker">All points are accounted for.</div>` : `<div class="pool-tracker">${mp.pool} point${mp.pool!==1?'s':''} still up for grabs</div>`;
  render(`
    <div class="panel">
      <div class="label">${gameOver ? 'Final Round' : 'Round result'}</div>
      ${destroyNote}
      <div style="color:var(--ink-dim); margin-bottom:10px;">${claimNote}</div>
      ${mpFinalScoreBlock()}
      ${poolLine}
      ${gameOver
        ? `<button class="action" onclick="showRoleSelect()">Play again</button>`
        : `<button class="action" onclick="mpStartRound()">Next round</button>`}
    </div>
    ${gameOver ? `<button class="ghost" onclick="showModeSelect()">← Back to menu</button>` : ''}
  `);
}
function mpDeckExhausted(){
  render(`
    <div class="panel">
      <div class="result-title">Deck exhausted</div>
      <div class="result-sub">Not enough cards remained to finish this round. Final totals stand as they are.</div>
      ${mpFinalScoreBlock()}
      <button class="action" onclick="showRoleSelect()">Play again</button>
    </div>
    <button class="ghost" onclick="showModeSelect()">← Back to menu</button>
  `);
}

showModeSelect();
</script>
</body>
</html>
